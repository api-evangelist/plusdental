name: PlusDental
description: 'PlusDental was a Berlin-based direct-to-consumer orthodontic company offering clear
  dental aligners ("Zahnschiene") for teeth straightening, backed by HV Capital. The brand has since
  been migrated to DR SMILE (operated by Sunshine Smile GmbH); plusdental.com now serves a handover
  notice redirecting customers to DR SMILE customer service. This is a consumer healthcare service with
  no public developer program, API, SDKs, or technical integration surface. Added to the API Evangelist
  network as a portfolio-lead stub; the enrichment pipeline confirmed no API artifacts exist.'
